version: '3.8'

services:
  # Backend API — Gmail scanning + reminder engine
  backend:
    build:
      context: .
      dockerfile: .ci/docker/Dockerfile.dev
    container_name: subscription-tracker-backend-dev
    ports:
      - "5000:5000"
      - "9229:9229"  # Node debugging port
    environment:
      - NODE_ENV=development
      - PORT=5000
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-subscription-hub-19cf9}
      - FIREBASE_SERVICE_ACCOUNT=${FIREBASE_SERVICE_ACCOUNT:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:5000/api/gmail/callback}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - CRON_SECRET=${CRON_SECRET:-}
    volumes:
      - ./backend/src:/app/src
      - /app/node_modules
    networks:
      - app-network
    restart: unless-stopped
    command: npm run dev

  # Frontend — React app built and served by nginx (proxies /api to backend)
  frontend:
    build:
      context: .
      dockerfile: .ci/docker/Dockerfile.frontend
    container_name: subscription-tracker-frontend-dev
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
