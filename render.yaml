# Render Blueprint — deploys the Sublet backend on the free plan.
# In Render: New → Blueprint → connect this repo. Values marked sync: false
# are secrets you paste once in the Render dashboard (see README → Deploying).
services:
  - type: web
    name: sublet-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        value: subscription-hub-19cf9
      - key: FRONTEND_URL
        sync: false # e.g. https://subscription-hub-19cf9.web.app
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false # paste the FULL contents of serviceAccountKey.json (one line)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false # e.g. https://sublet-api.onrender.com/api/gmail/callback
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_ENV
        value: sandbox
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CRON_SECRET
        sync: false # protects POST /api/reminders/run (used by cron-job.org)
